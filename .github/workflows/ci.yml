name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: check:privacy (real staged/tracked state)
        run: npm run check:privacy

      - name: Deliberate test — a deny-listed token is blocked
        run: |
          set -euo pipefail
          git config user.email "ci@example.com"
          git config user.name "CI"

          echo "ci-privacy-self-test-token" > scripts/ci-privacy-self-test.txt
          echo "ci-privacy-self-test-token" > /tmp/ci-denylist.txt
          git add scripts/ci-privacy-self-test.txt

          if PRIVACY_DENYLIST_FILE=/tmp/ci-denylist.txt npm run check:privacy; then
            echo "expected check:privacy to fail on a deny-listed token, but it passed"
            exit 1
          fi
          echo "OK: deny-listed token was blocked as expected"

          git reset scripts/ci-privacy-self-test.txt
          rm scripts/ci-privacy-self-test.txt

      - name: Deliberate test — clean tree passes
        run: npm run check:privacy
