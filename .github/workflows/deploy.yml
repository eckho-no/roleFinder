name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # cloudflare-env.d.ts is gitignored and never exists on a fresh
      # checkout. `npm run deploy` runs `next build` internally, which
      # type-checks the app and fails on the missing CloudflareEnv
      # binding types (env.DB etc.) without this — doesn't need
      # CLOUDFLARE_API_TOKEN, just reads wrangler.jsonc.
      - name: generate types
        run: npm run cf-typegen

      - name: Deploy
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npm run deploy | tee /tmp/deploy.log
          url="$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' /tmp/deploy.log | head -1)"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Smoke test the deployed URL
        run: |
          set -euo pipefail
          code="$(curl -s -o /dev/null -w '%{http_code}' "${{ steps.deploy.outputs.url }}")"
          echo "HTTP $code"
          if [[ "$code" != "200" ]]; then
            echo "::error::Deployed URL returned HTTP $code, expected 200"
            exit 1
          fi
